# ===================================================================
# Employee Payroll Management System - Full Stack Configuration
# Section: 802A | UIDs: 25BCS11387, 25BCS11028, 25BCS12318
# ===================================================================
spring.application.name=EmployeePayrollSystem
server.port=${PORT:8080}

# Local MySQL 8.0 Configuration (Overridable via environment variables on Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_payroll_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Auto-create schema and seed data on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Keep CLI menu enabled locally (set CLI_ENABLED=false on cloud server)
app.cli.enabled=${CLI_ENABLED:true}

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.payroll=INFO
