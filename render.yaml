services:
  - type: web
    name: employee-payroll-backend
    runtime: docker
    plan: free
    envVars:
      - key: CLI_ENABLED
        value: "false"
      - key: DB_URL
        value: "jdbc:h2:mem:employee_payroll_db;MODE=MySQL;DB_CLOSE_DELAY=-1"
      - key: DB_DRIVER
        value: "org.h2.Driver"
      - key: DB_USERNAME
        value: "sa"
      - key: DB_PASSWORD
        value: ""
